[package]
name = "multiavatar-studio"
version = "0.1.0"
edition = "2021"
description = "multiavatar Studio — 跨平台头像生成工作台（egui）：实时预览/批量生成/一键导出 SVG·PNG·JPEG·GIF·ICO·favicon.zip"
license = "MIT"
repository = "https://github.com/Demon1110/multiavatar-rust"
publish = false

[dependencies]
multiavatar = { path = ".." }
eframe = "0.32"          # egui 框架：Windows / Linux / macOS / Android / Web
image = "0.25"           # 预览解码：PNG/JPEG/GIF（位图 + GIF 帧动画）

# 原生文件保存对话框（桌面三平台；Android 无后端，走内部存储导出）
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"

# Android：eframe 需要原生窗口后端（cargo-ndk / cargo-apk 构建时生效）；
# 与上方 eframe="0.32" 合并声明，仅 android target 追加该特性。
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.32", features = ["android-native-activity"] }
