[package]
name = "multiavatar-studio"
version = "0.1.0"
edition = "2021"
description = "multiavatar Studio — 跨平台头像生成工作台（egui）：实时预览/批量生成/一键导出 SVG·PNG·JPEG·GIF·ICO·favicon.zip"
license = "MIT"
repository = "https://github.com/Demon1110/multiavatar-rust"
publish = false

[dependencies]
multiavatar = { path = ".." }
# glow（OpenGL）后端：体积小、绕开 wgpu/windows 依赖树；Windows/Linux/macOS/Android 均支持
eframe = { version = "0.37.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "clipboard",
    "wayland",
    "x11",
] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }   # 预览解码：只用 PNG/JPEG/GIF，裁掉其余 12 种格式解码器
# 直接声明 epaint 并开启 color_fonts（egui/eframe 未转发该特性）：
# 让系统彩色 emoji 字体（Segoe UI Emoji / Noto Color Emoji）可彩色渲染
epaint = { version = "0.37.0", features = ["color_fonts"] }
# egui 内置单色 emoji 字体（NotoEmoji-Regular + emoji-icon-font）挂在该 feature 下，
# 默认关闭导致所有 emoji 显示方框；显式开启（与 eframe 引用合并生效）
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }

# 原生文件保存对话框（桌面三平台；Android 无后端，走内部存储导出）
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17.2"

# Windows 构建时把 assets/app.ico 嵌入 exe 资源（build.rs 使用）
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Android：eframe 需要原生窗口后端（cargo-ndk / cargo-apk 构建时生效）；
# 与上方 eframe 声明合并（features 取并集），仅 android target 追加该特性。
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "android-native-activity",
    "glow",
    "default_fonts",
    "clipboard",
] }
