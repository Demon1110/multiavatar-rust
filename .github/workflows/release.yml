# Release workflow：
#   · push 到 main：自动递增 patch 版本 + 出 GitHub Release（含 demo 二进制与 .crate 源码包）；
#     提交信息含 "[publish]" 关键字时才同步发布 crates.io（Release → Run workflow 是手动替代路径）。
#   · 手动触发（workflow_dispatch）：可指定 minor / major，并可勾选是否发布 crates.io。
# 版本递增提交带 [skip ci]，避免自身提交再次触发本 workflow。

name: Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version_bump:
        description: "版本递增类型（push 自动触发时固定为 patch）"
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      publish:
        description: "是否发布到 crates.io（需仓库配置 CARGO_REGISTRY_TOKEN secret）"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ---- 1. 递增版本号（纯 bash，无 heredoc/python，避免引号转义坑）----
      - name: Bump version
        id: next_version
        run: |
          KIND="${{ github.event.inputs.version_bump || 'patch' }}"
          [ -z "$KIND" ] && KIND=patch
          VER="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          IFS=. read -r MAJ MIN PAT <<< "$VER"
          if [ "$KIND" = "major" ]; then MAJ=$((MAJ+1)); MIN=0; PAT=0
          elif [ "$KIND" = "minor" ]; then MIN=$((MIN+1)); PAT=0
          else PAT=$((PAT+1)); fi
          NV="$MAJ.$MIN.$PAT"
          sed -i "s/^version = .*/version = \"$NV\"/" Cargo.toml
          cargo metadata --no-deps --format-version 1 >/dev/null
          echo "version=$NV" >> "$GITHUB_OUTPUT"

      # ---- 2. 提交版本变更 + 打 tag（[skip ci] 防循环；version 空则跳过）----
      - name: Commit and tag
        if: steps.next_version.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          # Cargo.lock 被 .gitignore 忽略（库 crate 惯例，不随 checkout 存在）：
          # 存在才 add（cargo metadata 会在本地生成它），不存在则跳过
          git add Cargo.lock 2>/dev/null || true
          git commit -m "release: v${{ steps.next_version.outputs.version }} [skip ci]"
          git tag "v${{ steps.next_version.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.next_version.outputs.version }}"

      # ---- 3. 打包校验 + 发布 crates.io ----
      # 发布条件（三者缺一不可）：
      #   ① secret CARGO_REGISTRY_TOKEN 已配置；
      #   ② 手动触发（workflow_dispatch）且勾选 publish；
      #      或 push 触发且最近提交信息含 "[publish]" 关键字；
      #   ③ cargo package 校验通过（步骤顺序天然保证）。
      - name: Package verify
        run: cargo package --allow-dirty

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --registry crates-io
        if: |
          env.CARGO_REGISTRY_TOKEN != '' &&
          (
            (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') ||
            (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish]'))
          )

      # ---- 4. 构建可运行 demo 二进制并打 Release（附 .crate 源码包）----
      # 注意：不带 --locked——Cargo.lock 被 .gitignore 忽略，CI 检出时不存在
      - name: Build demo binary
        run: cargo build --release --example demo

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.next_version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ steps.next_version.outputs.version }}" \
            --generate-notes \
            target/package/multiavatar-*.crate \
            target/release/examples/demo
